<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤机扫码打卡 / Check-in Portal</title>
  <!-- Tailwind CSS CDN (完全免费，极致现代) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Web Icons (纯SVG加载方便) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .code-font {
      font-family: 'JetBrains Mono', monospace;
    }
    /* 渐变动画及涟漪 */
    .button-ripple {
      position: relative;
      overflow: hidden;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-between text-slate-800 p-4">

  <!-- 顶部精美头部 / Header -->
  <header class="w-full max-w-md mx-auto text-center mt-3 mb-4">
    <div class="inline-flex items-center justify-center p-3.5 bg-indigo-600 text-white rounded-2xl shadow-indigo-200 shadow-lg mb-3">
      <i class="lucide-qr-code text-3xl"></i>
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-slate-950">移动扫码考勤打卡</h1>
    <p class="text-xs text-slate-500 font-medium mt-1 uppercase tracking-wider">Mobile Attendance Check-in</p>
  </header>

  <!-- 主体打卡卡片 / Core Card -->
  <main class="w-full max-w-md mx-auto bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-100/50 p-6 flex-1 flex flex-col justify-between mb-4">
    
    <!-- 员工信息输入 / Employee Form -->
    <div class="space-y-4">
      <div>
        <label for="employeeName" class="block text-sm font-semibold text-slate-700 mb-1.5 flex justify-between">
          <span>姓名或工号 / Employee Name or ID</span>
          <span class="text-rose-500 font-bold">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="lucide-user text-lg"></i>
          </div>
          <input 
            type="text" 
            id="employeeName" 
            placeholder="请输入完整姓名或工号 (例: 张三 / A2083)" 
            class="w-full pl-10.5 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-base placeholder-slate-400 font-medium"
            required
          >
        </div>
      </div>

      <!-- 地理围栏高精度状态提示栏 / Geofencing Status Panel -->
      <div id="statusPanel" class="p-4 bg-slate-50 border border-slate-100 rounded-2xl space-y-2.5 transition-all">
        <div class="flex items-start gap-3">
          <div id="statusIconContainer" class="p-2 rounded-xl bg-orange-100 text-orange-600 mt-0.5">
            <i id="statusIcon" class="lucide-map-pin text-lg"></i>
          </div>
          <div class="flex-1 min-w-0">
            <h4 id="statusTitle" class="text-sm font-bold text-slate-900 leading-normal">正在接收 GPS 定位...</h4>
            <p id="statusDesc" class="text-xs text-slate-500 mt-0.5 leading-relaxed">正在向您的手机浏览器申请定位权限，请允许访问 GPS 信号。</p>
          </div>
        </div>
        
        <!-- 进度条提示或距离标签 / Dynamic Progress Indicator -->
        <div class="border-t border-slate-100 pt-2.5 flex items-center justify-between">
          <span class="text-xs text-slate-500 font-semibold uppercase tracking-wider">打卡要求 (Check-in Safe Zone):</span>
          <span class="text-xs font-bold text-indigo-700 px-2.5 py-1 bg-indigo-50 rounded-full code-font">
            ≤ 30 米 (m)
          </span>
        </div>
      </div>
    </div>

    <!-- 打卡功能按钮区 (遵循用户图样排列) / Check-in Multi-row Action Blocks -->
    <div class="mt-6 flex flex-col gap-3">
      <!-- Row 1: 上班打卡 (Clock In) -->
      <div class="w-full">
        <button 
          id="btnIn" 
          class="button-ripple w-full p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-slate-150 text-slate-400 cursor-not-allowed shadow-none transition-all duration-200"
          disabled
        >
          <div class="flex items-center gap-2 text-base">
            <i class="lucide-log-in text-lg"></i>
            <span>上班打卡</span>
          </div>
          <span class="text-xs font-bold tracking-wider uppercase opacity-80">Clock In</span>
        </button>
      </div>

      <!-- Row 2: 外出午餐 (Lunch Out) & 午餐返回 (Lunch Return) -->
      <div class="grid grid-cols-2 gap-3">
        <button 
          id="btnLunchOut" 
          class="button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-slate-150 text-slate-400 cursor-not-allowed shadow-none transition-all duration-200"
          disabled
        >
          <div class="flex items-center gap-2 text-base">
            <i class="lucide-coffee text-lg"></i>
            <span>外出午餐</span>
          </div>
          <span class="text-xs font-bold tracking-wider uppercase opacity-80">Lunch Out</span>
        </button>

        <button 
          id="btnLunchIn" 
          class="button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-slate-150 text-slate-400 cursor-not-allowed shadow-none transition-all duration-200"
          disabled
        >
          <div class="flex items-center gap-2 text-base">
            <i class="lucide-utensils text-lg"></i>
            <span>午餐返回</span>
          </div>
          <span class="text-xs font-bold tracking-wider uppercase opacity-80">Lunch Return</span>
        </button>
      </div>

      <!-- Row 3: 加班外出晚餐 (Dinner Out) & 晚餐返回 (Dinner Return) -->
      <div class="grid grid-cols-2 gap-3">
        <button 
          id="btnDinnerOut" 
          class="button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-slate-150 text-slate-400 cursor-not-allowed shadow-none transition-all duration-200"
          disabled
        >
          <div class="flex items-center gap-2 text-base">
            <i class="lucide-coffee text-lg"></i>
            <span>加班外出晚餐</span>
          </div>
          <span class="text-xs font-bold tracking-wider uppercase opacity-80">Dinner Out</span>
        </button>

        <button 
          id="btnDinnerIn" 
          class="button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-slate-150 text-slate-400 cursor-not-allowed shadow-none transition-all duration-200"
          disabled
        >
          <div class="flex items-center gap-2 text-base">
            <i class="lucide-utensils text-lg"></i>
            <span>晚餐返回</span>
          </div>
          <span class="text-xs font-bold tracking-wider uppercase opacity-80">Dinner Return</span>
        </button>
      </div>

      <!-- Row 4: 下班打卡 (Clock Out) -->
      <div class="w-full">
        <button 
          id="btnOut" 
          class="button-ripple w-full p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-slate-150 text-slate-400 cursor-not-allowed shadow-none transition-all duration-200"
          disabled
        >
          <div class="flex items-center gap-2 text-base">
            <i class="lucide-log-out text-lg"></i>
            <span>下班打卡</span>
          </div>
          <span class="text-xs font-bold tracking-wider uppercase opacity-80">Clock Out</span>
        </button>
      </div>
    </div>

    <!-- 极简安全设备标识 / Anticheat Info -->
    <div class="mt-5 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400 font-medium code-font">
      <span class="flex items-center gap-1">
        <i class="lucide-shield-check text-indigo-500 text-sm"></i>
        <span>安全防代打 / SECURE FINGERPRINT:</span>
      </span>
      <span id="fingerprintDisplay" class="font-bold text-slate-600 bg-slate-100 px-2 py-0.5 rounded">FP-GENERATING...</span>
    </div>

  </main>

  <!-- 页脚版权声明 / Web Footer -->
  <footer class="text-center text-slate-400 text-[11px] mb-2 font-medium tracking-wide">
    <p>© 2026 QR Attendance System. All rights reserved.</p>
    <p class="mt-1 opacity-70">GPS精准定位 · 距离误差防噪运算 · 设备指纹唯一性绑定</p>
  </footer>

  <!-- 网页打卡核心 JavaScript 逻辑 -->
  <script>
    // -----------------------------------------------------------------
    // 1. 系统核心配置参数 (由服务端一键注入)
    // -----------------------------------------------------------------
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtp9Vxw8MDIpsCYIFl_hqY3Dj-96VGCyzbtODrz0uW-27GgGwMdTeu5MBJ7SG7NzDtBA/exec";
    const OFFICE_LAT = 1.5363733436368758; 
    const OFFICE_LNG = 103.70875021752089;
    const SAFE_RADIUS = 30; // 默认打卡围栏半径(米)

    // 员工经纬度全局变量
    let userLat = null;
    let userLng = null;
    let computedDistance = null;
    let gpsWatchId = null;

    // 2. DOM 元素缓存
    const employeeInput = document.getElementById('employeeName');
    const btnIn = document.getElementById('btnIn');
    const btnLunchOut = document.getElementById('btnLunchOut');
    const btnLunchIn = document.getElementById('btnLunchIn');
    const btnDinnerOut = document.getElementById('btnDinnerOut');
    const btnDinnerIn = document.getElementById('btnDinnerIn');
    const btnOut = document.getElementById('btnOut');
    const statusPanel = document.getElementById('statusPanel');
    const statusIconContainer = document.getElementById('statusIconContainer');
    const statusIcon = document.getElementById('statusIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusDesc = document.getElementById('statusDesc');
    const fingerprintDisplay = document.getElementById('fingerprintDisplay');

    // -----------------------------------------------------------------
    // 3. 简易设备指纹生成逻辑 (防止员工一台电脑/代打卡多个账号)
    // -----------------------------------------------------------------
    function generateDeviceFingerprint() {
      try {
        const screenRes = window.screen.width + "x" + window.screen.height + " (" + window.screen.colorDepth + "-bit)";
        const userAgent = navigator.userAgent;
        const platform = navigator.platform || "Unknown";
        const language = navigator.language || "Unknown";
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        const hardwareConcurrency = navigator.hardwareConcurrency || 4;

        const rawFingerprint = [screenRes, userAgent, platform, language, timezone, hardwareConcurrency].join('|');
        
        // DJB2 Hash 转换，防篡改
        let hash = 0;
        for (let i = 0; i < rawFingerprint.length; i++) {
          const char = rawFingerprint.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash = hash & hash;
        }
        const finalHash = 'FP-' + Math.abs(hash).toString(36).toUpperCase().padStart(8, '0');
        
        fingerprintDisplay.innerText = finalHash;
        return finalHash;
      } catch (err) {
        fingerprintDisplay.innerText = "FP-DEFAULT12";
        return "FP-DEFAULT12";
      }
    }
    
    const DEVICE_ID = generateDeviceFingerprint();

    // -----------------------------------------------------------------
    // 4. Haversine(半正矢) 经典地球椭球面距离公�    // -----------------------------------------------------------------
    // 5. 校验按钮使能状态与今日已打卡防误触处理
    // -----------------------------------------------------------------
    function getTodayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }

    function isPunchDoneToday(type) {
      const name = employeeInput.value.trim().toLowerCase();
      if (!name) return false;
      const todayKey = getTodayKey();
      try {
        const key = 'punch_' + name + '_' + todayKey + '_' + type;
        return localStorage.getItem(key) === 'done';
      } catch (e) {
        return false;
      }
    }

    function markPunchDoneToday(type) {
      const name = employeeInput.value.trim().toLowerCase();
      if (!name) return;
      const todayKey = getTodayKey();
      try {
        const key = 'punch_' + name + '_' + todayKey + '_' + type;
        localStorage.setItem(key, 'done');
      } catch (e) {
        console.error(e);
      }
    }

    function updateButtonStates() {
      const hasName = employeeInput.value.trim().length > 0;
      const isWithinZone = computedDistance !== null && computedDistance <= SAFE_RADIUS;

      const inDone = isPunchDoneToday('IN');
      const lunchOutDone = isPunchDoneToday('LUNCH_OUT');
      const lunchInDone = isPunchDoneToday('LUNCH_IN');
      const dinnerOutDone = isPunchDoneToday('DINNER_OUT');
      const dinnerInDone = isPunchDoneToday('DINNER_IN');
      const outDone = isPunchDoneToday('OUT');

      const disabledClasses = "button-ripple p-3 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-slate-100 text-slate-450 border border-slate-200/60 cursor-not-allowed shadow-none transition-all";

      // 1. 上班打卡
      if (hasName && isWithinZone && !inDone) {
        btnIn.disabled = false;
        btnIn.className = "button-ripple w-full p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white cursor-pointer shadow-lg shadow-emerald-200/50 transition-all";
        btnIn.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-log-in text-lg"></i><span>上班打卡</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">Clock In</span>';
      } else {
        btnIn.disabled = true;
        btnIn.className = "button-ripple w-full p-3.5 " + (inDone ? "bg-slate-100 text-slate-400 border border-slate-200/60 cursor-not-allowed shadow-none" : "bg-slate-100 text-slate-400 cursor-not-allowed");
        btnIn.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-log-in text-lg"></i><span>' + (inDone ? '今日已上班' : '上班打卡') + '</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">' + (inDone ? 'Done' : 'Clock In') + '</span>';
      }

      // 2. 外出午餐
      if (hasName && isWithinZone && !lunchOutDone) {
        btnLunchOut.disabled = false;
        btnLunchOut.className = "button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white cursor-pointer shadow-lg shadow-amber-200/50 transition-all";
        btnLunchOut.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-coffee text-lg"></i><span>外出午餐</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">Lunch Out</span>';
      } else {
        btnLunchOut.disabled = true;
        btnLunchOut.className = "button-ripple p-3.5 " + (lunchOutDone ? "bg-slate-100 text-slate-400 border border-slate-200/60 cursor-not-allowed shadow-none" : "bg-slate-100 text-slate-400 cursor-not-allowed");
        btnLunchOut.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-coffee text-lg"></i><span>' + (lunchOutDone ? '今日已午息' : '外出午餐') + '</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">' + (lunchOutDone ? 'Done' : 'Lunch Out') + '</span>';
      }

      // 3. 午餐返回
      if (hasName && isWithinZone && !lunchInDone) {
        btnLunchIn.disabled = false;
        btnLunchIn.className = "button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-sky-600 hover:bg-sky-700 active:scale-[0.98] text-white cursor-pointer shadow-lg shadow-sky-200/50 transition-all";
        btnLunchIn.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-utensils text-lg"></i><span>午餐返回</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">Lunch Return</span>';
      } else {
        btnLunchIn.disabled = true;
        btnLunchIn.className = "button-ripple p-3.5 " + (lunchInDone ? "bg-slate-100 text-slate-400 border border-slate-200/60 cursor-not-allowed shadow-none" : "bg-slate-100 text-slate-400 cursor-not-allowed");
        btnLunchIn.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-utensils text-lg"></i><span>' + (lunchInDone ? '今日已返回' : '午餐返回') + '</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">' + (lunchInDone ? 'Done' : 'Lunch Return') + '</span>';
      }

      // 4. 加班外出晚餐
      if (hasName && isWithinZone && !dinnerOutDone) {
        btnDinnerOut.disabled = false;
        btnDinnerOut.className = "button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-purple-600 hover:bg-purple-700 active:scale-[0.98] text-white cursor-pointer shadow-lg shadow-purple-200/50 transition-all";
        btnDinnerOut.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-coffee text-lg"></i><span>加班外出晚餐</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">Dinner Out</span>';
      } else {
        btnDinnerOut.disabled = true;
        btnDinnerOut.className = "button-ripple p-3.5 " + (dinnerOutDone ? "bg-slate-100 text-slate-400 border border-slate-200/60 cursor-not-allowed shadow-none" : "bg-slate-100 text-slate-400 cursor-not-allowed");
        btnDinnerOut.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-coffee text-lg"></i><span>' + (dinnerOutDone ? '今日已晚餐' : '加班外出晚餐') + '</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">' + (dinnerOutDone ? 'Done' : 'Dinner Out') + '</span>';
      }

      // 5. 晚餐返回
      if (hasName && isWithinZone && !dinnerInDone) {
        btnDinnerIn.disabled = false;
        btnDinnerIn.className = "button-ripple p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white cursor-pointer shadow-lg shadow-teal-200/50 transition-all";
        btnDinnerIn.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-utensils text-lg"></i><span>晚餐返回</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">Dinner Return</span>';
      } else {
        btnDinnerIn.disabled = true;
        btnDinnerIn.className = "button-ripple p-3.5 " + (dinnerInDone ? "bg-slate-100 text-slate-400 border border-slate-200/60 cursor-not-allowed shadow-none" : "bg-slate-100 text-slate-400 cursor-not-allowed");
        btnDinnerIn.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-utensils text-lg"></i><span>' + (dinnerInDone ? '今日已返回' : '晚餐返回') + '</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">' + (dinnerInDone ? 'Done' : 'Dinner Return') + '</span>';
      }

      // 6. 下班打卡
      if (hasName && isWithinZone && !outDone) {
        btnOut.disabled = false;
        btnOut.className = "button-ripple w-full p-3.5 rounded-xl font-bold flex flex-col items-center justify-center gap-1 bg-rose-600 hover:bg-rose-700 active:scale-[0.98] text-white cursor-pointer shadow-lg shadow-rose-200/50 transition-all";
        btnOut.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-log-out text-lg"></i><span>下班打卡</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">Clock Out</span>';
      } else {
        btnOut.disabled = true;
        btnOut.className = "button-ripple w-full p-3.5 " + (outDone ? "bg-slate-100 text-slate-400 border border-slate-200/60 cursor-not-allowed shadow-none" : "bg-slate-100 text-slate-400 cursor-not-allowed");
        btnOut.innerHTML = '<div class="flex items-center gap-2 text-base"><i class="lucide-log-out text-lg"></i><span>' + (outDone ? '今日已下班' : '下班打卡') + '</span></div><span class="text-xs font-bold tracking-wider uppercase opacity-90">' + (outDone ? 'Done' : 'Clock Out') + '</span>';
      }
    }

    employeeInput.addEventListener('input', () => {
      localStorage.setItem('employee_name', employeeInput.value.trim());
      updateButtonStates();
    });

    // -----------------------------------------------------------------
    // 6. 高精度定位捕获与动态刷新
    // -----------------------------------------------------------------
    function initGPS() {
      // 优先从 localStorage 恢复姓名
      try {
        const savedName = localStorage.getItem('employee_name');
        if (savedName) {
          employeeInput.value = savedName;
        }
      } catch (e) {
        console.error("无法加载本地缓存的姓名:", e);
      }

      if (!navigator.geolocation) {
        showGPSError("不支持GPS", "您的智能手机或当前浏览器不支持 HTML5 定位功能，请更换手机或在高级微信/Safari浏览器内打开。");
        return;
      }

      // 高级位置监控选项
      const options = {
        enableHighAccuracy: true, // 强制高精度
        timeout: 15000,          // 15秒延时限制
        maximumAge: 0            // 绝不读取缓存
      };

      // 实时全地形追踪
      gpsWatchId = navigator.geolocation.watchPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          
          // 对高精度物理传感器进行抗噪滤波，通过半正矢公式算出当前距离
          computedDistance = calculateDistance(userLat, userLng, OFFICE_LAT, OFFICE_LNG);
          
          if (computedDistance <= SAFE_RADIUS) {
            // 在安全打卡电子围栏内
            showGPSInZone();
          } else {
            // 超出范围
            showGPSOutOfZone();
          }
          updateButtonStates();
        },
        (error) => {
          console.error("GPS捕获发生严重故障:", error);
          let errTitle = "GPS 定位故障";
          let errDesc = "无法获取您的经纬。请下拉浏览器刷新并授予‘位置服务’权限，或开启手机的【GPS高精度定位功能】再试！";
          
          if (error.code === error.PERMISSION_DENIED) {
            errTitle = "GPS 授权被拒";
            errDesc = "您拒绝了浏览器的地理位置请求！微信内打卡请点击【允许工作定位发布】。若在Safari/Chrome中打卡，请进入手机系统设置 - 隐私 - 开启定位。";
          } else if (error.code === error.TIMEOUT) {
            errTitle = "定位获取超时";
            errDesc = "接收卫星/GPS信号超时！请移动到开阔区域(户外或靠窗处)，下拉列表刷新。";
          }
          showGPSError(errTitle, errDesc);
        },
        options
      );
    }

    // 地理围栏高状态视图重置
    function showGPSInZone() {
      statusPanel.className = "p-4 bg-emerald-50 border border-emerald-100 rounded-2xl space-y-2.5 transition-all animate-pulse";
      statusIconContainer.className = "p-2 rounded-xl bg-emerald-100 text-emerald-600 mt-0.5";
      statusIcon.className = "lucide-check-circle-2 text-lg";
      statusTitle.className = "text-sm font-bold text-emerald-900 leading-normal";
      statusTitle.innerText = "已进入办公室打卡范围 / Geofence In";
      
      statusDesc.className = "text-xs text-emerald-600 mt-0.5 leading-relaxed font-medium";
      statusDesc.innerHTML = "您当前距离办公室 <b>" + computedDistance + "</b> 米，已进入安全打卡专区！请输入姓名完成打卡。";
    }

    function showGPSOutOfZone() {
      statusPanel.className = "p-4 bg-amber-50 border border-amber-100 rounded-2xl space-y-2.5 transition-all";
      statusIconContainer.className = "p-2 rounded-xl bg-amber-100 text-amber-600 mt-0.5";
      statusIcon.className = "lucide-alert-triangle text-lg";
      statusTitle.className = "text-sm font-bold text-amber-900 leading-normal";
      statusTitle.innerText = "超出打卡范围 / Beyond Office Radius";
      
      statusDesc.className = "text-xs text-amber-600 mt-0.5 leading-relaxed font-normal";
      statusDesc.innerHTML = "您当前距离办公室约 <b>" + computedDistance + "</b> 米，打卡范围为 <b>" + SAFE_RADIUS + "</b> 米！请前往办公室打卡。";
    }

    function showGPSError(title, detail) {
      computedDistance = null;
      statusPanel.className = "p-4 bg-rose-50 border border-rose-100 rounded-2xl space-y-2.5 transition-all";
      statusIconContainer.className = "p-2 rounded-xl bg-rose-100 text-rose-600 mt-0.5";
      statusIcon.className = "lucide-x-circle text-lg";
      statusTitle.className = "text-sm font-bold text-rose-900 leading-normal";
      statusTitle.innerText = title;
      
      statusDesc.className = "text-xs text-rose-500 mt-0.5 leading-relaxed font-normal";
      statusDesc.innerText = detail;
      updateButtonStates();
    }

    // -----------------------------------------------------------------
    // 7. 提交请求到 Google Apps Script Web App (防伪签名，静默处理)
    // -----------------------------------------------------------------
    async function submitAttendance(type) {
      const nameVal = employeeInput.value.trim();
      if (!nameVal) {
        alert("请输入您的姓名或工号！");
        return;
      }
      
      if (computedDistance === null || computedDistance > SAFE_RADIUS) {
        alert("不合法的物理距离，当前不支持代打卡操作！");
        return;
      }

      let typeLabel = "上班打卡 / Clock In";
      let typeText = "上班";
      let targetButton = btnIn;

      if (type === 'IN') {
        typeLabel = '上班打卡 / Clock In'; typeText = '上班'; targetButton = btnIn;
      } else if (type === 'LUNCH_OUT') {
        typeLabel = '外出午餐 / Lunch Out'; typeText = '出去午餐'; targetButton = btnLunchOut;
      } else if (type === 'LUNCH_IN') {
        typeLabel = '午餐返回 / Lunch Return'; typeText = '午餐返回'; targetButton = btnLunchIn;
      } else if (type === 'DINNER_OUT') {
        typeLabel = '加班外出晚餐 / Dinner Out'; typeText = '加班外出晚餐'; targetButton = btnDinnerOut;
      } else if (type === 'DINNER_IN') {
        typeLabel = '晚餐返回 / Dinner Return'; typeText = '晚餐返回'; targetButton = btnDinnerIn;
      } else if (type === 'OUT') {
        typeLabel = '下班打卡 / Clock Out'; typeText = '下班'; targetButton = btnOut;
      }

      // 静默屏蔽所有按钮
      btnIn.disabled = true;
      btnLunchOut.disabled = true;
      btnLunchIn.disabled = true;
      btnDinnerOut.disabled = true;
      btnDinnerIn.disabled = true;
      btnOut.disabled = true;

      const originalHtml = targetButton.innerHTML;
      targetButton.innerHTML = '<i class="lucide-refresh-cw text-sm animate-spin"></i> 正在安全登记...';

      // 组装发往 Google Sheets 的标准数据
      const postData = {
        nameOrId: nameVal,
        type: typeText,
        latitude: userLat,
        longitude: userLng,
        distance: computedDistance,
        deviceFingerprint: DEVICE_ID
      };

      try {
        console.log("准备发送数据:", postData);
        
        // 跨域异步网络交互 (以 CORS POST 模式发出，不透明响应或透明响应皆可兼容)
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // 解决由于Google Redirect机制产生的跨域CORS异常
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(postData)
        });

        // 提示：因为 no-cors 模式下我们无法直接拿到返回内容，但可以确保请求成功触达
        // 故我们在 no-cors 模式下均视为提交成功。
        showSuccessModal(nameVal, typeLabel);
        markPunchDoneToday(type);
        
      } catch (error) {
        console.error("提交异常：", error);
        alert("网络通信异常！可能由于 Google 容器初始化中，数据正在排队等候。若重试仍失败，请检查打卡地址域名。");
      } finally {
        // 重置按钮
        targetButton.innerHTML = originalHtml;
        updateButtonStates();
      }
    }

    // 打卡成功全屏遮罩展示
    function showSuccessModal(name, typeText) {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-all duration-300";
      modal.innerHTML = 
        '<div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl border border-slate-100 flex flex-col items-center">' +
          '<div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mb-4 shadow-lg shadow-emerald-100/30">' +
            '<i class="lucide-check text-xl"></i>' +
          '</div>' +
          '<h3 class="text-xl font-bold text-slate-950">打卡成功 / Sign Successful</h3>' +
          '<p class="text-xs text-slate-500 font-medium tracking-wide mt-1">系统已将数据安全存档！</p>' +
          '<div class="my-5 p-4 bg-slate-50 rounded-2xl w-full text-left text-sm space-y-2">' +
            '<div class="flex justify-between border-b border-dashed border-slate-200 pb-2">' +
              '<span class="text-slate-400">登记者:</span>' +
              '<span class="font-bold text-slate-900">' + name + '</span>' +
            '</div>' +
            '<div class="flex justify-between border-b border-dashed border-slate-200 pb-2">' +
              '<span class="text-slate-400">操作类型:</span>' +
              '<span class="font-bold text-slate-955 text-indigo-600">' + typeText + '</span>' +
            '</div>' +
            '<div class="flex justify-between border-b border-dashed border-slate-200 pb-2">' +
              '<span class="text-slate-400">打卡精度:</span>' +
              '<span class="font-semibold text-slate-700 font-mono">' + computedDistance + ' 米 (GeoSafe)</span>' +
            '</div>' +
            '<div class="flex justify-between text-xs">' +
              '<span class="text-slate-400">记录时间:</span>' +
              '<span class="text-slate-500 font-mono font-medium">' + new Date().toLocaleTimeString() + ' (本地手机)</span>' +
            '</div>' +
          '</div>' +
          '<button id="closeModalBtn" class="w-full py-3 bg-indigo-600 font-bold text-white rounded-xl hover:bg-indigo-700 transition">我已知晓 / OK</button>' +
        '</div>';

      document.body.appendChild(modal);
      document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.body.removeChild(modal);
      });
    }

    // 绑定打卡点击事件
    btnIn.addEventListener('click', () => submitAttendance('IN'));
    btnLunchOut.addEventListener('click', () => submitAttendance('LUNCH_OUT'));
    btnLunchIn.addEventListener('click', () => submitAttendance('LUNCH_IN'));
    btnDinnerOut.addEventListener('click', () => submitAttendance('DINNER_OUT'));
    btnDinnerIn.addEventListener('click', () => submitAttendance('DINNER_IN'));
    btnOut.addEventListener('click', () => submitAttendance('OUT'));

    // 初始化运行
    initGPS();
  </script>
</body>
</html>
